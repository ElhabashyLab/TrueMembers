# THIS FILE CONTAINS THE CONFIGURATION FOR THE TRUE MEMBERS PIPELINE
# evcouplings, foldseek, USalign, hmmpress and hmmsearch should be installed and in Path and runnable

global:
  # Maximum number of iterations the pipeline performs (only considered if convergence_run is set to False)
  iterations: 3
  # Number of max parallel iterations to run
  max_parallel_jobs: 5
  # If set true the pipeline will run new iterations until number of detected Members converges (If true, iterations will be ignored)
  convergence_run: True
  # Threshold used to determine lowest number of new sequences which have to be obtained per iteration (int)
  absolute_floor: 4
  # Window of consecutive iterations observed to determine convergence (int)
  patience_window: 6

run:
  # Uniprot ID of the target seed (initial seed)
  seed_uid: Q5SK37
  # Region start of target
  seed_region_start: 507
  # Region end of target
  seed_region_end: 569
  # Relative bit-scores used in the seqeunce based search with jackhmmer (f.e. [0.2, 0.4, 0.6, 0.8])
  bit_scores: [0.2, 0.4, 0.6, 0.8]
  # TM-score cutoff for filtering (f.e. 0.6)
  tm_score_cutoff: 0.6
  # HMMs folder path to scan proteins for additional domains (HMMs should contain a GA cutoff)
  hmms_folder_path: hmm_domain_filters
  # structural filter tool: usalign, foldseek, or both
  structural_filter_tool: usalign
  # CPU number
  CPU: 10
  # Optional path to local UniProt FASTA for sequence fetching (empty = use REST API)
  uniprot_fasta_path: /mpcdf/soft/RHEL_9/packages.norpm/x86_64/evcouplings/0.2.1/data/DB/uniprot/uniprot_2026_4.fasta
  # Directory to store the FASTA index file (empty = default to .uniprot_index/ in repo root)
  # Useful when FASTA db is on write protected filesystem and index cannot be created there
  uniprot_fasta_index_dir: uniprot_index
