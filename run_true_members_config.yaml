# THIS FILE CONTAINS THE CONFIGURATION FOR THE TRUE MEMBERS PIPELINE
# evcouplings, foldseek, USalign, hmmpress and hmmsearch should be installed and in Path and runnable

global:
  # number of iterations to perform (index starts from 1)
  iterations: 3
  # number of max parallel jobs to run (int)
  max_parallel_jobs: 5
  # if set true the pipeline will run until number of True Members converges
  convergence_run: True
  # threshold used to determine lowest number of new sequences which have to be obtained per run (int)
  absolute_floor: 4
  # window of consecutive iterations observed to determine convergence (int)
  patience_window: 6

# parameters for first iteration
# following iterations will use the same:
# bit_scores, tm_score_cutoff, hmms_folder_path and CPU number
run:
  # starting SEED uniprot id
  seed_uid: Q5SK37
  # starting SEED region
  seed_region_start: 507
  seed_region_end: 569
  # Bit-scores f.e. [0.2, 0.4, 0.6, 0.8]
  bit_scores: [0.2, 0.4, 0.6, 0.8]
  # TM-score cutoff for filtering f.e. 0.6
  tm_score_cutoff: 0.6
  # HMMs folder path (HMMs should contain a GA cutoff)
  hmms_folder_path: hmm_domain_filters
  # structural filter tool: usalign, foldseek, or both
  structural_filter_tool: usalign
  # CPU number
  CPU: 10
  # Optional path to local UniProt FASTA for sequence fetching (empty = use REST API)
  uniprot_fasta_path: /mpcdf/soft/RHEL_9/packages.norpm/x86_64/evcouplings/0.2.1/data/DB/uniprot/uniprot_2026_4.fasta
