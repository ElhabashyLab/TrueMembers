# HPC conda environment for TrueMembers
# Only conda-forge is allowed on MPCDF systems.
# External bioinformatics tools (foldseek, USalign, hmmer, evcouplings)
# should be loaded as HPC modules in the Slurm submission scripts.
name: truemembers
channels:
  - conda-forge
  - nodefaults
channel_priority: strict
custom_channels:
  main: null
  r: null
  anaconda: null
  msys2: null
dependencies:
  - python>=3.10
  - pandas>=2.0
  - biopython>=1.80
  - requests>=2.28
  - pyyaml>=6.0
  - foldseek
  - usalign
  - hmmer
  - pip
  - pip:
      - -e .

channels:
  - conda-forge
  - nodefaults

